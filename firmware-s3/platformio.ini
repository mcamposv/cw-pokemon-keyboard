[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
; Layout: comment/uncomment as needed
build_flags =
    -DLAYOUT_ES
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=0
;   -DLAYOUT_US
